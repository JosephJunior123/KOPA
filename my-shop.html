<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ma boutique - KOPA</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">

            KOPA

        </div>

        <nav>

            <a href="intex.html">

                🏡Accueil

            </a>

            <a href="cart.html">

                🛒Panier

            </a>

        </nav>

    </header>

    <main>

        <section class="shop-header">

            <h1 id="my-shop-name">

                Ma boutique

            </h1>

            <p id="my-shop-category">

                Catégorie

            </p>

            <p id="my-shop-description">

                Description

            </p>
            <p id="my-shop-owner">👤 Commerçant</p>

<p id="my-shop-address">📍 Adresse</p>

<p id="my-shop-phone">📱 Téléphone</p>

<div id="my-owner-photo-container"></div>

        </section>

        <section class="products">

            <h2>Mes produits</h2>
            <button class="add-product-btn" onclick="showProductForm()">
                ➕ Ajouter un produit
            </button>
            <div id="product-form-container"></div>

            <div class="product-container">
                <div id="my-products-container"></div>
                <div class="product-card">

                    <div class="product-image">

                        🛍️

                    </div>

                    <h3>Mon premier produit</h3>

                    <p>25 $</p>

                    <button>

                        Ajouter au panier

                    </button>

                </div>

            </div>

        </section>
        <!-- ===== MES COMMANDES ===== -->

        <section class="my-orders">

            <h2>📦 Mes commandes</h2>

            <div id="my-orders-container">

                <div class="empty-orders">

                    <div class="empty-orders-icon">

                        📦

                    </div>

                    <h3>

                        Aucune commande pour le moment

                    </h3>

                    <p>

                        Les commandes de vos clients

                        apparaîtront ici.

                    </p>

                </div>

            </div>

        </section>

    </main>
    <script src="cart.js"></script>
    <script src="my-shop.js"></script>

</body>

</html>
