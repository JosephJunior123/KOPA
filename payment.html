<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta

        name="viewport"

        content="width=device-width, initial-scale=1.0"

    >

    <title>Paiement - KOPA</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">

            KOPA

        </div>

        <nav>

            <a href="intex.html">

                🏡 Accueil

            </a>

            <a href="cart.html">

                🛒 Panier

            </a>

        </nav>

    </header>

    <main>

        <section class="payment">

            <div class="payment-card">

                <h1>

                    💳 Paiement

                </h1>

                <p>

                    Choisissez votre moyen de paiement.

                </p>

                <form id="payment-form">

                    <label class="payment-option">

    <input

        type="radio"

        name="payment-method"

        value="orange-money"

        required

    >

    <img

        src="orange-money.png"

        alt="Orange Money"

        class="payment-logo"

    >

    <span class="payment-details">

        <strong>Orange Money</strong>

        <small>Paiement mobile</small>

    </span>

</label>

<label class="payment-option">

    <input

        type="radio"

        name="payment-method"

        value="airtel-money"

    >

    <img

        src="airtel-money.png"

        alt="Airtel Money"

        class="payment-logo"

    >

    <span class="payment-details">

        <strong>Airtel Money</strong>

        <small>Paiement mobile</small>

    </span>

</label>

<label class="payment-option">

    <input

        type="radio"

        name="payment-method"

        value="mpesa"

    >

    <img

        src="vodacom-mpesa.png"

        alt="Vodacom M-Pesa"

        class="payment-logo"

    >

    <span class="payment-details">

        <strong>Vodacom M-Pesa</strong>

        <small>Paiement mobile</small>

    </span>

</label>
                    <button type="submit">

                        Continuer →

                    </button>

                </form>

            </div>

        </section>

    </main>

    <script src="payement.js"></script>

</body>

</html>
