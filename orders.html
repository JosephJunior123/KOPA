<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mes commandes - KOPA</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <header class="navbar">

        <div class="logo">
            KOPA
        </div>

        <nav>

            <a href="intex.html">
                🏡 Accueil
            </a>

            <a href="my-shop.html">
                🏪 Ma boutique
            </a>

            <a href="cart.html">
                🛒 Panier
            </a>

        </nav>

    </header>

    <main>

        <section class="orders">

            <h1>
                📦 Mes commandes
            </h1>

            <p class="orders-intro">
                Retrouvez ici les commandes reçues
                dans votre boutique.
            </p>
            <div class="orders-stats">

    <div class="stat-card">
        <span>📦</span>
        <strong id="total-orders">0</strong>
        <p>Total</p>
    </div>

    <div class="stat-card">
        <span>🟡</span>
        <strong id="new-orders">0</strong>
        <p>Nouvelles</p>
    </div>

    <div class="stat-card">
        <span>🔵</span>
        <strong id="preparing-orders">0</strong>
        <p>En préparation</p>
    </div>

    <div class="stat-card">
        <span>🟢</span>
        <strong id="ready-orders">0</strong>
        <p>Prêtes</p>
    </div>

    <div class="stat-card">
        <span>✅</span>
        <strong id="delivered-orders">0</strong>
        <p>Livrées</p>
    </div>

</div>

            <div id="orders-container">

                <p>
                    Aucune commande pour le moment.
                </p>

            </div>

        </section>

    </main>
    <script src="orders.js"></script>
</body>

</html>
