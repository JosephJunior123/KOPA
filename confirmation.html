<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta

        name="viewport"

        content="width=device-width, initial-scale=1.0"

    >

    <title>Commande confirmée - KOPA</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">

            KOPA

        </div>

        <nav>

            <a href="intex.html">

                🏡 Accueil

            </a>

            <a href="cart.html">

                🛒 Panier

            </a>

        </nav>

    </header>

    <main>

        <section class="confirmation">

            <div class="confirmation-card">

                <div class="success-icon">

                    ✓

                </div>

                <h1>

                    Commande confirmée !

                </h1>

                <p class="confirmation-message">

                    Merci pour votre commande.

                    Votre demande a bien été enregistrée.

                </p>

                <div

                    id="order-summary"

                    class="order-summary"

                >

                </div>

                <button

                    onclick="window.location.href='intex.html'"

                >

                    🏡 Retour à l'accueil

                </button>

                <button

                    class="secondary-button"

                    onclick="window.location.href='cart.html'"

                >

                    🛒 Voir mon panier

                </button>

            </div>

        </section>

    </main>

    <script src="confirmation.js"></script>

</body>

</html>
