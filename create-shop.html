<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Créer ma boutique - KOPA</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header class="navbar">

        <div class="logo">

            KOPA

        </div>

        <nav>

            <a href="intex.html">🏡Accueil</a>

            <a href="cart.html">🛒Panier</a>

        </nav>

    </header>

    <main>

        <section class="create-shop-section">
            <div class="create-shop-card">

            <h1>🏪 Créer ma boutique</h1>

            <p>

                Créez votre boutique et commencez à vendre sur KOPA.

            </p>
            <form id="shop-form">
                <label for="shop-name">

    Nom de la boutique

</label>

<input

    type="text"

    id="shop-name"

    placeholder="Exemple : Sarah Fashion"

    required

>

<label for="shop-category">

    Catégorie

</label>

<input

    type="text"

    id="shop-category"

    placeholder="Exemple : Mode et vêtements"

    required

>

<label for="shop-description">

    Description de la boutique

</label>

<textarea

    id="shop-description"

    placeholder="Présentez votre boutique..."

    required

></textarea>

<label for="owner-name">

    Nom du commerçant

</label>

<input

    type="text"

    id="owner-name"

    placeholder="Votre nom complet"

    required

>

<label for="shop-address">

    Adresse de la boutique

    <span class="optional">Si nécessaire</span>

</label>

<input

    type="text"

    id="shop-address"

    placeholder="Exemple : Lubumbashi, RDC"

>

<label for="owner-photo">

    📸 Photo du vendeur

    <span class="optional">Si nécessaire</span>

</label>

<input

    type="file"

    id="owner-photo"

    accept="image/*"

>

<label for="owner-phone">

    📱 Numéro de téléphone du vendeur

</label>

<div class="phone-field">

    <span>+243</span>

    <input

        type="tel"

        id="owner-phone"

        placeholder="81 234 5678"

        required

    >

</div>

<button type="submit">

    🏪 Créer ma boutique

</button>
                <!-- tes champs actuels ici -->
            </form>
            </div>

   
        </section>

    </main>
    <script src="create-shop.js"></script>

</body>

</html>
