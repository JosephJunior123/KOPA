<!DOCTYPE html> 
<html lang="fr"> 
    <head> 
        <meta charset="UTF-8"> 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Tech Store - KOPA</title> 
        <link rel="stylesheet" href="style.css"> 
    </head> 
    <body> 
        <header class="navbar"> 
            <div class="logo"> 
                KOPA 
            </div> 
            <nav> 
                <a href="index.html">Accueil</a> 
                <a href="cart.html">Panier</a> 
            </nav> 
        </header> 
        <main> 
            <section class="shop-header"> 
                <h1>Tech Store</h1> 
                <p>Téléphones et accessoires</p> 
            </section> 
            <section class="products"> 
                <h2>Nos produits</h2> 
                <div class="product-container"> 
                    <div class="product-card"> 
                        <div class="product-image"> 
                            📱 
                        </div> 
                        <h3>Smartphone</h3> 
                        <p>300 $</p> 
                        <button onclick="addToCart('Smartphone', 300)">
                            Ajouter au panier
                        </button> 
                    </div> 
                    <div class="product-card"> 
                        <div class="product-image"> 
                            💻 
                        </div> 
                        <h3>Ordinateur portable</h3> 
                        <p>700 $</p> 
                        <button onclick="addToCart('Ordinateur portable', 700)">
                            Ajouter au panier
                        </button> 
                    </div> 
                    <div class="product-card"> 
                        <div class="product-image"> 
                            🎧 
                        </div> 
                        <h3>Casque Bluetooth</h3> 
                        <p>50 $</p> 
                        <button onclick="addToCart('Casque Bluetooth', 50)">
                            Ajouter au panier
                        </button> 
                    </div> 
                </div> 
            </section> 
        </main>
        <script src="cart.js"></script> 
    </body> 
</html>
